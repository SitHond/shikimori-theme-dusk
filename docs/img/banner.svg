<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1230"/>
      <stop offset=".55" stop-color="#0f1124"/>
      <stop offset="1" stop-color="#090711"/>
    </linearGradient>
    <radialGradient id="moon" cx=".76" cy=".3" r=".32">
      <stop offset="0" stop-color="#d8ceff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d8ceff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx=".3" cy=".45" r=".3">
      <stop offset="0" stop-color="#7bc9f2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7bc9f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx=".88" cy=".9" r=".35">
      <stop offset="0" stop-color="#ffb76a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffb76a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8ceff"/>
      <stop offset=".6" stop-color="#a98cff"/>
      <stop offset="1" stop-color="#ffd6a3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="300" rx="18" fill="url(#cyan)"/>
  <rect width="1200" height="300" rx="18" fill="url(#moon)"/>
  <rect width="1200" height="300" rx="18" fill="url(#lamp)"/>

  <!-- звёзды -->
  <g fill="#e2dcf0">
    <circle cx="120" cy="48" r="1.4" opacity=".7"/><circle cx="260" cy="90" r="1" opacity=".5"/>
    <circle cx="410" cy="36" r="1.2" opacity=".6"/><circle cx="560" cy="70" r="1" opacity=".45"/>
    <circle cx="690" cy="30" r="1.5" opacity=".7"/><circle cx="1040" cy="44" r="1.1" opacity=".55"/>
    <circle cx="1130" cy="110" r="1" opacity=".5"/><circle cx="980" cy="150" r="1.2" opacity=".4"/>
    <circle cx="70" cy="200" r="1" opacity=".4"/><circle cx="330" cy="250" r="1.2" opacity=".35"/>
    <circle cx="640" cy="240" r="1" opacity=".35"/><circle cx="820" cy="70" r="1" opacity=".5"/>
  </g>

  <!-- луна -->
  <circle cx="912" cy="92" r="34" fill="#d8ceff" opacity=".9"/>
  <circle cx="928" cy="82" r="30" fill="#151026"/>

  <!-- лампа на столе -->
  <g opacity=".95">
    <path d="M1022 188 L990 262 L1112 262 L1068 188 Z" fill="#ffb76a" opacity=".12"/>
    <rect x="970" y="262" width="190" height="6" rx="3" fill="#2a1f3f"/>
    <rect x="1080" y="256" width="36" height="8" rx="3" fill="#3a2b59"/>
    <path d="M1098 258 L1104 206 L1052 160" fill="none" stroke="#3a2b59" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1104" cy="206" r="5" fill="#463365"/>
    <path d="M1036 158 L1058 158 L1072 188 L1018 188 Z" fill="#463365"/>
    <ellipse cx="1045" cy="189" rx="12" ry="4" fill="#ffd6a3"/>
  </g>

  <rect width="1200" height="300" rx="18" fill="url(#vignette)"/>

  <text x="80" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="2" fill="url(#title)">shiki dusk</text>
  <text x="84" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#bbb1cb">тёмная тема для шикимори · фиолетовые сумерки и тёплый свет лампы</text>
  <rect x="84" y="226" width="64" height="4" rx="2" fill="#a96b34"/>
</svg>
